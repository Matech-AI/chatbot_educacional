name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch: # Permite execução manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Hostinger VPS

    steps:
      - name: 🚀 Deploy to Hostinger
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 DEPLOY AUTOMÁTICO INICIADO - $(date)"
            echo "=========================================="

            # Navegar para o diretório do projeto
            cd /root/dna-forca-complete

            # Verificar status atual
            echo "📊 Status atual do sistema:"
            ./status.sh

            # Backup não é necessário - código está no GitHub
            echo "💾 Pulando backup (código disponível no GitHub)"

            # Parar sistema atual
            echo "🛑 Parando sistema atual..."
            ./stop_all.sh

            # Aguardar processos terminarem
            sleep 5

            # Fazer pull das mudanças
            echo "📥 Atualizando código do GitHub..."
            git fetch origin
            git reset --hard origin/main

            # Verificar se há mudanças
            if [ $? -eq 0 ]; then
              echo "✅ Código atualizado com sucesso!"
            else
              echo "❌ Erro ao atualizar código!"
              exit 1
            fi

            # Verificar estrutura do projeto
            echo "🔍 Verificando estrutura do projeto..."
            if [ -d "src" ]; then
              echo "✅ Frontend (src/) encontrado"
            else
              echo "❌ Frontend (src/) não encontrado!"
              exit 1
            fi

            if [ -d "backend" ]; then
              echo "✅ Backend encontrado"
            else
              echo "❌ Backend não encontrado!"
              exit 1
            fi

            # Verificar scripts
            if [ -f "start_all.sh" ] && [ -f "stop_all.sh" ] && [ -f "status.sh" ]; then
              echo "✅ Scripts de gerenciamento encontrados"
            else
              echo "❌ Scripts de gerenciamento não encontrados!"
              exit 1
            fi

            # Dar permissão de execução aos scripts
            chmod +x *.sh

            # Instalar dependências npm se necessário
            echo "📦 Instalando dependências do frontend..."
            npm install --frozen-lockfile 2>/dev/null || npm install

            # Iniciar sistema
            echo "🚀 Iniciando sistema atualizado..."
            ./start_all.sh

            # Aguardar inicialização
            echo "⏳ Aguardando inicialização dos serviços..."
            sleep 15

            # Verificar status final
            echo "📊 Status final do sistema:"
            ./status.sh

            # Testar endpoints principais com timeout
            echo "🧪 Testando endpoints..."

            # Testar Frontend
            if timeout 10 curl -s http://localhost:3000 > /dev/null; then
              echo "✅ Frontend funcionando (porta 3000)"
            else
              echo "❌ Frontend não responde (porta 3000)"
              echo "🔍 Verificando logs do frontend..."
              docker logs $(docker ps -q --filter "name=frontend") --tail 20
            fi

            # Testar RAG Server
            if timeout 10 curl -s http://localhost:8001/health > /dev/null; then
              echo "✅ RAG Server funcionando (porta 8001)"
            else
              echo "❌ RAG Server não responde (porta 8001)"
              echo "🔍 Verificando logs do RAG Server..."
              docker logs $(docker ps -q --filter "name=rag-server") --tail 20
            fi

            # Testar API Server
            if timeout 10 curl -s http://localhost:8002/health > /dev/null; then
              echo "✅ API Server funcionando (porta 8002)"
            else
              echo "❌ API Server não responde (porta 8002)"
              echo "🔍 Verificando logs do API Server..."
              docker logs $(docker ps -q --filter "name=api-server") --tail 20
            fi

            # Testar Redis
            if timeout 5 docker exec $(docker ps -q --filter "name=redis") redis-cli ping > /dev/null 2>&1; then
              echo "✅ Redis funcionando (porta 6379)"
            else
              echo "❌ Redis não responde (porta 6379)"
            fi

            # Verificar se todos os serviços estão funcionando
            failed_services=0
            if ! timeout 10 curl -s http://localhost:3000 > /dev/null; then
              failed_services=$((failed_services + 1))
            fi
            if ! timeout 10 curl -s http://localhost:8001/health > /dev/null; then
              failed_services=$((failed_services + 1))
            fi
            if ! timeout 10 curl -s http://localhost:8002/health > /dev/null; then
              failed_services=$((failed_services + 1))
            fi

            if [ $failed_services -gt 0 ]; then
              echo "⚠️  ATENÇÃO: $failed_services serviço(s) não estão respondendo!"
              echo "🔍 Verificando logs de todos os serviços..."
              docker ps --format "table {{.Names}}\t{{.Status}}"
              echo ""
              echo "📋 Logs dos serviços:"
              docker logs $(docker ps -q) --tail 10
              echo ""
              echo "❌ Deploy concluído com problemas!"
              echo "📞 Entre em contato com o administrador se os problemas persistirem."
            else
              echo ""
              echo "🎉 DEPLOY AUTOMÁTICO CONCLUÍDO COM SUCESSO - $(date)"
              echo "✅ Todos os serviços estão funcionando corretamente!"
            fi

            echo ""
            echo "📍 URLs de acesso:"
            echo "   Frontend: http://31.97.16.142:3000"
            echo "   RAG Server: http://31.97.16.142:8001"
            echo "   API Server: http://31.97.16.142:8002"
            echo ""
            echo "📋 Comandos úteis:"
            echo "   Verificar status: ./status.sh"
            echo "   Ver logs: tail -f logs/*.log"
            echo "   Reiniciar: ./stop_all.sh && ./start_all.sh"
