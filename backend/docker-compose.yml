version: "3.8"

services:
  rag-server:
    image: matheusbnas/rag-server:latest
    ports:
      - "8001:8001"
    environment:
      - CORS_ORIGINS=http://31.97.16.142:3000,http://localhost:3000,http://127.0.0.1:3000,https://iadnadaforca.com.br,https://www.iadnadaforca.com.br
      - PORT=8001
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    networks:
      - network_swarm_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_swarm_public"
      - "traefik.http.routers.rag.rule=Host(`iadnadaforca.com.br`) && PathPrefix(`/rag`)"
      - "traefik.http.routers.rag.entrypoints=web,websecure"
      - "traefik.http.services.rag.loadbalancer.server.port=8001"
      - "traefik.http.routers.rag.tls.certresolver=letsencryptresolver"
      - "traefik.http.middlewares.rag-stripprefix.stripprefix.prefixes=/rag"
      - "traefik.http.routers.rag.middlewares=rag-stripprefix"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8002:8002"
    environment:
      - LOG_LEVEL=INFO
      - PORT=8002
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://31.97.16.142:3000,http://localhost:3000,http://127.0.0.1:3000,https://iadnadaforca.com.br,https://www.iadnadaforca.com.br
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_DRIVE_API_KEY=${GOOGLE_DRIVE_API_KEY}
      - GOOGLE_CREDENTIALS_PATH=/app/data/credentials.json
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
    networks:
      - network_swarm_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_swarm_public"
      - "traefik.http.routers.api.rule=Host(`iadnadaforca.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.services.api.loadbalancer.server.port=8002"
      - "traefik.http.routers.api.tls.certresolver=letsencryptresolver"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - network_swarm_public
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_swarm_public"
      - "traefik.http.routers.frontend.rule=Host(`iadnadaforca.com.br`)"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.tls.certresolver=letsencryptresolver"
    networks:
      - network_swarm_public

volumes:
  rag_data:
    external: true
    name: rag_data
  api_data:
    external: true
    name: api_data
  redis_data:
    external: true
    name: redis_data

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
